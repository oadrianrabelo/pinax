# Compila o APK.
#  - Chamado pelo release.yml com a versão nova → anexa à Release.
#  - À mão (Actions → Android → Run workflow):
#      versão = 0.2.2  → recompila e substitui o APK dessa Release
#      ref    = branch → APK de teste, baixável nos artefatos da execução (não publica nada)
name: Android
on:
  workflow_call:
    inputs:
      version: { type: string, required: true }
  workflow_dispatch:
    inputs:
      version: { description: 'Versão publicada (ex.: 0.2.2)', type: string, required: false }
      ref: { description: 'Ou um branch, para um APK de teste', type: string, required: false }
permissions:
  contents: write
jobs:
  apk:
    runs-on: ubuntu-latest
    env:
      TEST_REF: ${{ inputs.ref }}
      VERSION: ${{ inputs.version }}
    steps:
      - uses: actions/checkout@v4
        with: { ref: "${{ inputs.ref || format('v{0}', inputs.version) }}" }
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '17' }
      - uses: dtolnay/rust-toolchain@stable
        with: { targets: 'aarch64-linux-android,armv7-linux-androideabi,x86_64-linux-android,i686-linux-android' }
      - uses: swatinem/rust-cache@v2
        with: { workspaces: src-tauri }
      - run: npm ci
      - name: Gerar o projeto Android e encaixar o Rete (compartilhar, arquivos)
        run: |
          export NDK_HOME="$ANDROID_NDK_LATEST_HOME"
          npx tauri android init --ci
          if [ -f scripts/android-patch.mjs ]; then node scripts/android-patch.mjs; fi
      - name: Compilar APK (modo de produção, um por processador)
        run: |
          export NDK_HOME="$ANDROID_NDK_LATEST_HOME"
          npx tauri android build --apk --split-per-abi --target aarch64 --target armv7
      - name: Assinar
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: |
          BT=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -n1)
          if [ -n "$KEYSTORE_B64" ]; then
            echo "$KEYSTORE_B64" | base64 -d > rete.keystore
            PASS="$KEYSTORE_PASSWORD"
          else
            echo "::warning::ANDROID_KEYSTORE_BASE64 não configurado — APK assinado com chave temporária"
            PASS=temporaria
            keytool -genkeypair -keystore rete.keystore -storepass "$PASS" -keypass "$PASS" -alias rete \
              -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Rete" >/dev/null
          fi
          V="${VERSION:-teste}"
          for abi in arm64 arm; do
            IN=$(find src-tauri/gen/android -path "*/$abi/release/*.apk" | head -n1)
            [ -z "$IN" ] && { echo "APK $abi não encontrado"; find src-tauri/gen/android -name '*.apk'; exit 1; }
            NAME=$([ "$abi" = arm64 ] && echo "Rete_${V}_android.apk" || echo "Rete_${V}_android-armv7.apk")
            "$BT/zipalign" -f -p 4 "$IN" aligned.apk
            "$BT/apksigner" sign --ks rete.keystore --ks-pass "pass:$PASS" --ks-key-alias rete --out "$NAME" aligned.apk
            ls -lh "$NAME"
          done
      - name: Anexar à Release
        if: ${{ !inputs.ref }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release upload "v${VERSION}" "Rete_${VERSION}_android.apk" "Rete_${VERSION}_android-armv7.apk" --clobber
      - name: APK de teste (artefato)
        if: ${{ inputs.ref }}
        uses: actions/upload-artifact@v4
        with:
          name: Rete-teste-android
          path: Rete_teste_android*.apk
          retention-days: 7
