# Mantém o projeto Supabase (plano grátis) acordado: ele pausa depois de 7 dias sem uso.
# Uma vez por dia faz uma consulta mínima. Sem dados: o RLS devolve lista vazia para quem
# não está logado — só conta como atividade.
# Usa a URL e a chave pública de .env.production; enquanto não existirem, só avisa e sai.
name: Manter o Supabase acordado
on:
  schedule:
    - cron: '23 11 * * *'   # todo dia, 08:23 em Brasília
  workflow_dispatch:
permissions:
  contents: read
jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { sparse-checkout: .env.production, sparse-checkout-cone-mode: false }
      - name: Consulta mínima
        run: |
          if [ ! -f .env.production ]; then echo "Sem .env.production — sincronização ainda não configurada."; exit 0; fi
          set -a; . ./.env.production; set +a
          KEY="${VITE_SUPABASE_PUBLISHABLE_KEY:-$VITE_SUPABASE_ANON_KEY}"
          if [ -z "$VITE_SUPABASE_URL" ] || [ -z "$KEY" ]; then echo "URL ou chave ausente."; exit 0; fi
          CODE=$(curl -s -o resposta.txt -w '%{http_code}' "$VITE_SUPABASE_URL/rest/v1/items?select=id&limit=1" -H "apikey: $KEY")
          echo "Supabase respondeu $CODE"
          if [ "$CODE" != "200" ]; then
            cat resposta.txt
            echo "::error::O projeto não respondeu como esperado (pausado?). Abra o painel do Supabase e clique em Restore."
            exit 1
          fi
