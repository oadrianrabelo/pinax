# A cada push na main:
#  1. semantic-release lê os commits (Conventional Commits), decide a versão,
#     atualiza CHANGELOG.md e package.json, cria a tag vX.Y.Z e a Release.
#  2. Se saiu versão nova, compila os instaladores e anexa à Release:
#     Windows (.msi/.exe), macOS (.dmg universal), Linux (.deb/.AppImage/.rpm) e Android (.apk).
#  3. Com a chave de assinatura configurada, publica latest.json → os apps
#     instalados no computador se atualizam sozinhos.
name: Release
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
  issues: write
  pull-requests: write
concurrency:
  group: release
  cancel-in-progress: false

jobs:
  version:
    runs-on: ubuntu-latest
    outputs:
      published: ${{ steps.sr.outputs.new_release_published }}
      version: ${{ steps.sr.outputs.new_release_version }}
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - name: Marco inicial v0.1.0 (só na primeira vez, para a contagem seguir em 0.x)
        run: |
          if [ -z "$(git tag -l 'v*')" ]; then
            git tag v0.1.0 "$(git rev-list --max-parents=0 HEAD | tail -n1)"
            git push origin v0.1.0
          fi
      - id: sr
        uses: cycjimmy/semantic-release-action@v4
        with:
          extra_plugins: |
            @semantic-release/changelog@6
            @semantic-release/git@10
            conventional-changelog-conventionalcommits@8
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  desktop:
    needs: version
    if: needs.version.outputs.published == 'true'
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: windows-latest, args: '' }
          - { os: macos-latest, args: '--target universal-apple-darwin' }
          - { os: ubuntu-22.04, args: '' }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with: { ref: 'v${{ needs.version.outputs.version }}' }
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.os == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}
      - uses: swatinem/rust-cache@v2
        with: { workspaces: src-tauri }
      - if: matrix.os == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf libxdo-dev
      - run: npm ci
      - name: Atualizador (só se a chave de assinatura existir)
        shell: bash
        env:
          KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
        run: |
          if [ -n "$KEY" ]; then echo '{"bundle":{"createUpdaterArtifacts":true}}' > updater.conf.json; else echo '{}' > updater.conf.json; fi
      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: v${{ needs.version.outputs.version }}
          releaseName: Rete v${{ needs.version.outputs.version }}
          releaseDraft: false
          prerelease: false
          includeUpdaterJson: true
          args: ${{ matrix.args }} --config updater.conf.json

  android:
    needs: version
    if: needs.version.outputs.published == 'true'
    uses: ./.github/workflows/android.yml
    with:
      version: ${{ needs.version.outputs.version }}
    secrets: inherit
