<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024">
  <defs>
    <radialGradient id="bg" cx="38%" cy="28%" r="85%">
      <stop offset="0" stop-color="#3b2a1d"/><stop offset=".55" stop-color="#1e150e"/><stop offset="1" stop-color="#0f0a07"/>
    </radialGradient>
    <linearGradient id="wood" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#d9a35c"/><stop offset=".45" stop-color="#a86f34"/><stop offset="1" stop-color="#6e4420"/>
    </linearGradient>
    <linearGradient id="woodEdge" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f0c27e" stop-opacity=".9"/><stop offset="1" stop-color="#5a361a" stop-opacity=".0"/>
    </linearGradient>
    <radialGradient id="wax" cx="40%" cy="30%" r="90%">
      <stop offset="0" stop-color="#5a3518"/><stop offset=".6" stop-color="#3a210d"/><stop offset="1" stop-color="#241307"/>
    </radialGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffe2a0"/><stop offset=".5" stop-color="#e3a94b"/><stop offset="1" stop-color="#b57a2a"/>
    </linearGradient>
    <linearGradient id="stylus" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#f6dfb0"/><stop offset=".5" stop-color="#d0a868"/><stop offset="1" stop-color="#8a6230"/>
    </linearGradient>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="18" stdDeviation="22" flood-color="#000" flood-opacity=".55"/></filter>
    <filter id="engrave"><feDropShadow dx="0" dy="-3" stdDeviation="1.5" flood-color="#000" flood-opacity=".7"/></filter>
  </defs>
  <rect width="1024" height="1024" rx="228" fill="url(#bg)"/>
  <!-- a tabuinha de trás: duas presas pelo cordão viram um caderno -->
  <g filter="url(#soft)" transform="rotate(-14 512 512) translate(-34 26)">
    <rect x="232" y="176" width="560" height="690" rx="46" fill="#7a4a22"/>
    <rect x="232" y="176" width="560" height="690" rx="46" fill="#000" opacity=".28"/>
  </g>
  <!-- tabuinha -->
  <g filter="url(#soft)" transform="rotate(-6 512 512)">
    <rect x="232" y="176" width="560" height="690" rx="46" fill="url(#wood)"/>
    <rect x="232" y="176" width="560" height="690" rx="46" fill="url(#woodEdge)" opacity=".35"/>
    <!-- veios da madeira -->
    <g stroke="#5a3519" stroke-opacity=".28" stroke-width="3" fill="none">
      <path d="M250 230 C 380 215, 520 245, 775 222"/><path d="M250 838 C 420 852, 600 826, 775 846"/>
      <path d="M258 300 C 252 480, 262 640, 254 810"/><path d="M768 300 C 776 470, 764 650, 772 810"/>
    </g>
    <!-- cera -->
    <rect x="300" y="250" width="424" height="544" rx="18" fill="url(#wax)"/>
    <rect x="300" y="250" width="424" height="544" rx="18" fill="none" stroke="#000" stroke-opacity=".55" stroke-width="6"/>
    <!-- furos do cordão (como as tabuinhas eram amarradas em caderno) -->
    <circle cx="266" cy="360" r="11" fill="#2a170b"/><circle cx="266" cy="690" r="11" fill="#2a170b"/>
    <!-- cordão -->
    <g fill="none" stroke="#b8452f" stroke-width="9" stroke-linecap="round">
      <path d="M266 360 C 214 352, 196 392, 226 410"/>
      <path d="M266 690 C 214 682, 196 722, 226 740"/>
    </g>
    <!-- linhas riscadas na cera -->
    <g stroke="#e3a94b" stroke-opacity=".16" stroke-width="4" stroke-linecap="round">
      <path d="M345 682 H 612"/><path d="M345 724 H 560"/><path d="M345 766 H 590"/>
    </g>
    <!-- π gravado -->
    <text x="512" y="612" text-anchor="middle" font-family="'GFS Didot', 'Noto Serif Display', Georgia, serif" font-size="360" fill="url(#gold)" filter="url(#engrave)">π</text>
    <!-- estrela do astrolábio -->
    <path transform="translate(650 330)" d="M0 -38 L9 -9 L38 0 L9 9 L0 38 L-9 9 L-38 0 L-9 -9 Z" fill="url(#gold)"/>
    <circle cx="650" cy="330" r="56" fill="none" stroke="#e3a94b" stroke-opacity=".35" stroke-width="3"/>
  </g>
  <!-- estilete -->
  <g filter="url(#soft)" transform="rotate(38 512 512)">
    <rect x="770" y="300" width="26" height="470" rx="13" fill="url(#stylus)"/>
    <path d="M770 770 L783 845 L796 770 Z" fill="#c99a55"/>
    <rect x="766" y="300" width="34" height="40" rx="10" fill="#e9cf98"/>
  </g>
</svg>
